<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="XApp — a fast expense tracker with budgets, insights and beautiful charts."
    />
    <meta name="theme-color" content="#6366f1" />
    <meta property="og:title" content="XApp — Expense Tracker" />
    <meta
      property="og:description"
      content="Track spending, set budgets and visualize your money — all stored locally in your browser."
    />
    <meta property="og:type" content="website" />
    <title>XApp — Expense Tracker</title>
    <script>
      try {
        var s = JSON.parse(
          localStorage.getItem('expense-tracker-store') || '{}'
        );
        if (s && s.state && s.state.theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
